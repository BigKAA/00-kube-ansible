---
# Stakater Reloader (автоматический reload при изменении ConfigMap/Secret).

- name: Установить Stakater Reloader
  when: reloaderEnable
  block:
      - name: Добавить репозиторий Stakater [online]
        when: k8s_install_mode == "online"
        kubernetes.core.helm_repository:
            name: stakater
            repo_url: https://stakater.github.io/stakater-charts

      - name: Установить Stakater Reloader [online]
        when: k8s_install_mode == "online"
        kubernetes.core.helm:
            name: reloader
            chart_ref: stakater/reloader
            chart_version: "{{ reloaderChartVersion }}"
            release_namespace: kube-system
            create_namespace: false
            values:
                # top-level pull-secret + registry (image.repository = полный путь)
                imagePullSecrets: "{{ utils_global_image_pull_secrets }}"
                imageRegistry: "{{ reloaderImageRegistry }}"
                image:
                    repository: "{{ reloaderImageRegistry }}/{{ reloaderImageRepository }}"
                reloader:
                    reloadStrategy: "{{ reloaderReloadStrategy }}"

      - name: Установить Stakater Reloader [offline]
        when: k8s_install_mode == "offline"
        kubernetes.core.helm:
            name: reloader
            chart_ref: "{{ playbook_dir }}/{{ k8s_offline_dir }}/utils/helm-charts/reloader-{{ reloaderChartVersion }}.tgz"
            release_namespace: kube-system
            create_namespace: false
            values:
                imagePullSecrets: "{{ utils_global_image_pull_secrets }}"
                imageRegistry: "{{ reloaderImageRegistry }}"
                image:
                    repository: "{{ reloaderImageRegistry }}/{{ reloaderImageRepository }}"
                reloader:
                    reloadStrategy: "{{ reloaderReloadStrategy }}"
