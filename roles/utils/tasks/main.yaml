---
# ============================================================
# Роль utils — установка утилит и CLI на первой control node.
# ============================================================
# Порядок выполнения учитывает зависимости:
#   1. Helm (нужен для всех helm-чартов)
#   2. CLI-инструменты (cilium/yq/stern)
#   3. Приватный registry (imagePullSecrets до всех утилит)
#   4. Priority classes (до утилит, использующих high-priority)
#   5. cert-manager (до envoy-gateway для TLS)
#   6. Метрики, хранилище, сеть
#   7. ArgoCD (после всего, т.к. может управлять другими утилитами)
# ============================================================

- name: Установить Helm и helm-diff
  ansible.builtin.include_tasks: helm.yaml

- name: Установить CLI-инструменты (cilium/yq/stern)
  ansible.builtin.include_tasks: cli-tools.yaml

- name: Подготовить приватный registry (imagePullSecrets)
  ansible.builtin.include_tasks: registry.yaml

- name: Применить priority classes
  ansible.builtin.include_tasks: priorityclass.yaml

- name: Установить cert-manager
  ansible.builtin.include_tasks: cert-manager.yaml

- name: Установить Metrics Server
  ansible.builtin.include_tasks: metrics-server.yaml

- name: Установить NFS CSI Driver
  ansible.builtin.include_tasks: nfs-csi.yaml

- name: Установить Stakater Reloader
  ansible.builtin.include_tasks: reloader.yaml

- name: Установить MetalLB
  ansible.builtin.include_tasks: metallb.yaml

- name: Установить Envoy Gateway (Gateway API)
  ansible.builtin.include_tasks: envoy-gateway.yaml

- name: Установить ArgoCD
  ansible.builtin.include_tasks: argocd.yaml
