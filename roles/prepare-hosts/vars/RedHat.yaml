# Переменные для семейства RedHat (Rocky, Alma, CentOS, RHEL)

# Системные пакеты (без IPVS — они в packages_ipvs)
packages_common:
    - net-tools
    - mc
    - iproute-tc
    - vim
    - git
    - bash-completion
    - nfs-utils
    - tar
    - chrony
    - jq
    - python3-pyyaml
    - kernel-modules

# Пакеты IPVS для kube-proxy (mode: ipvs).
# Устанавливаются только при включённом kube-proxy (kube_proxy_enabled).
# При cni: cilium + cilium_kube_proxy_replacement: true kube-proxy отсутствует → не нужны.
packages_ipvs:
    - ipvsadm
    - ipset

# Пакеты Kubernetes
packages_k8s:
    - "kubectl-{{ kube_version }}"
    - "kubelet-{{ kube_version }}"
    - "kubeadm-{{ kube_version }}"

# NTP сервис
ntp_service: chronyd

# Firewall сервис
firewall_service: firewalld

# HA пакеты
packages_ha:
    - keepalived
    - haproxy
