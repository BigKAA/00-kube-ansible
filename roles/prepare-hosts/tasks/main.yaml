---
# Точка расширения: pre-prepare hooks
- name: Выполнить pre-prepare hooks
  ansible.builtin.include_tasks: "{{ item }}"
  loop: "{{ pre_prepare_tasks | default([]) }}"
  when: pre_prepare_tasks | default([]) | length > 0

# Загрузка переменных семейства ОС
- name: Загрузить переменные семейства ОС
  ansible.builtin.include_vars: "{{ ansible_facts['os_family'] }}.yaml"

# ============================================================
# Системные пакеты
# ============================================================

- name: Установка системных пакетов
  ansible.builtin.dnf:
      name: "{{ packages_common }}"
      state: present

# Пакеты IPVS (ipvsadm, ipset) нужны только работающему kube-proxy (mode: ipvs).
# При cni: cilium + cilium_kube_proxy_replacement: true kube-proxy отсутствует.
- name: Установка пакетов IPVS для kube-proxy
  when: kube_proxy_enabled
  ansible.builtin.dnf:
      name: "{{ packages_ipvs }}"
      state: present

# ============================================================
# NTP
# ============================================================

- name: Включить NTP сервер
  ansible.builtin.service:
      name: "{{ ntp_service }}"
      state: started
      enabled: true

# ============================================================
# Firewall (только RedHat)
# ============================================================

- name: Отключить firewalld
  when:
      - ansible_facts['os_family'] == "RedHat"
      - firewall_service != ""
  block:
      - name: Проверить наличие firewalld
        ansible.builtin.command: systemctl list-unit-files "{{ firewall_service }}.service"
        register: firewalld_check
        changed_when: false
        failed_when: false

      - name: Остановить и отключить firewalld
        ansible.builtin.service:
            name: "{{ firewall_service }}"
            state: stopped
            enabled: false
        when: "'firewalld.service' in firewalld_check.stdout"
  rescue:
      - name: Firewalld не найден — пропуск
        ansible.builtin.debug:
            msg: "firewalld не установлен, пропуск"

# ============================================================
# Swap
# ============================================================

- name: Проверить swap
  ansible.builtin.command: swapon --show --noheadings
  register: swap_ret
  changed_when: false

- name: Отключить swap
  ansible.builtin.command: swapoff -a
  when: swap_ret.stdout != ""

- name: Закомментировать swap в fstab
  when: swap_ret.stdout != ""
  ansible.builtin.replace:
      path: /etc/fstab
      regexp: '^([^#].*\s*swap\s*.*)$'
      replace: '# \1'

# ============================================================
# SELinux (только RedHat)
# ============================================================

- name: Отключить SELinux
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.selinux:
      state: disabled
  register: selinux_ret

- name: Setenforce 0
  when: ansible_facts['os_family'] == "RedHat" and selinux_ret.changed
  ansible.builtin.command:
      cmd: setenforce 0

# ============================================================
# Общие настройки
# ============================================================

- name: Настроить crictl.yaml
  ansible.builtin.template:
      src: crictl.j2
      dest: /etc/crictl.yaml
      owner: root
      mode: u=rw,g=r,o=r

# На RHEL/Rocky 10 netfilter-модули (xt_comment, xt_tcpudp, xt_addrtype,
# xt_mark, xt_MASQUERADE) и ip_set находятся в kernel-modules/kernel-modules-extra
# для КОНКРЕТНОЙ версии ядра. Cilium использует iptables для masquerade
# (enableIPv4Masquerade: true) даже в режиме kube-proxy-replacement — без xt_*
# reconciliation падает (RULE_APPEND failed … Extension comment not supported),
# MASQUERADE в POSTROUTING не ставится, трафик pod→node-IP дропается rp_filter.
# Поэтому kernel-modules-extra нужен всегда, независимо от режима kube-proxy
# (IPVS без xt_* тоже работать не будет).
# Если ядро обновилось, но host не перезагружен, dnf install kernel-modules
# поставит модули для нового ядра, а запущенное останется без xt_*/ip_set.
# Ставим kernel-modules-extra под текущее запущенное ядро.
- name: Установить kernel-modules-extra для запущенного ядра [RedHat]
  when: ansible_facts['os_family'] == "RedHat"
  ansible.builtin.dnf:
      name: "kernel-modules-extra-{{ ansible_facts.kernel }}"
      state: present
  register: _kernel_modules_extra
  retries: 3
  delay: 5
  until: _kernel_modules_extra is not failed
  # Пакет может отсутствовать в репозитории (например, ядро устарело и удалено из mirror)
  ignore_errors: true

# depmod делает только что установленные модули доступными для autoload
# без перезагрузки — иначе xt_*/ip_set подхватятся только после reboot.
- name: Перестроить базу модулей ядра (depmod) [RedHat]
  when:
      - ansible_facts['os_family'] == "RedHat"
      - _kernel_modules_extra is changed
  ansible.builtin.command: depmod -a
  changed_when: true

- name: Предупредить об отсутствии kernel-modules-extra
  when:
      - ansible_facts['os_family'] == "RedHat"
      - _kernel_modules_extra is failed
  ansible.builtin.debug:
      msg: "Внимание: kernel-modules-extra для ядра {{ ansible_facts.kernel }} недоступен. Cilium (iptables-masquerade — нет xt_*) и/или IPVS kube-proxy (нет ip_set) могут не работать, трафик pod→node-IP будет дропаться."

- name: Загрузить модуль br_netfilter
  community.general.modprobe:
      name: br_netfilter
  # На ядрах 6.12+ (Rocky 10, RHEL 10) модуль br_netfilter удалён и заменён
  # на nf_conntrack_bridge. Игнорируем ошибку — Flannel/Cilium не требуют его.
  ignore_errors: true

- name: Загрузить модуль overlay
  community.general.modprobe:
      name: overlay

- name: Загрузить модуль nf_conntrack
  community.general.modprobe:
      name: nf_conntrack
  # nf_conntrack обязателен для kube-proxy (nf_conntrack_max sysctl).
  # Без него kube-proxy падает с
  # "open /proc/sys/net/netfilter/nf_conntrack_max: no such file or directory".

# Модули для IPVS-режима kube-proxy (mode: ipvs в kubeadm-config).
# ip_set обязателен — без него kube-proxy падает с
# "can't use the IPVS proxier: error getting ipset version".
# Требуются только при включённом kube-proxy: при cni: cilium +
# cilium_kube_proxy_replacement: true kube-proxy отсутствует (eBPF заменяет его),
# и IPVS-модули не нужны.
- name: Загрузить модули IPVS (ip_set, ip_vs)
  when: kube_proxy_enabled
  community.general.modprobe:
      name: "{{ item }}"
  loop:
      - ip_set
      - ip_vs_rr
      - ip_vs_wrr
      - ip_vs_sh
  # Модуль ip_vs подгружается автоматически при старте kube-proxy.
  # ip_set может отсутствовать, если не установлен kernel-modules для
  # запущенного ядра — ниже отдельная задача проверяет наличие.
  ignore_errors: true

# Постоянная загрузка модулей. Шаблон включает IPVS-модули (ip_set, ip_vs_*)
# только при включённом kube-proxy.
- name: Загрузить модули постоянно
  ansible.builtin.template:
      src: modules-kubernetes.conf.j2
      dest: /etc/modules-load.d/modules-kubernetes.conf
      owner: root
      mode: u=rw,g=r,o=r

- name: Настроить sysctl
  ansible.posix.sysctl:
      name: "{{ item.name }}"
      value: "{{ item.value }}"
      state: present
  # bridge-nf-call-* могут отсутствовать на ядрах 6.12+ (нет br_netfilter)
  ignore_errors: true
  loop:
      - name: net.ipv4.ip_forward
        value: 1
      - name: net.bridge.bridge-nf-call-iptables
        value: 1
      - name: net.bridge.bridge-nf-call-ip6tables
        value: 1
      - name: vm.max_map_count
        value: 262144

- name: Настроить PS1
  ansible.builtin.lineinfile:
      path: ~/.bashrc
      state: present
      line: "PS1='\\[\\e[44;36m\\]\\t:[\\w]\\[\\e[0;0m\\]\\n\\[\\e[0;31;04m\\]\\u\\[\\e[0;0m\\]@\\[\\e[0;32m\\]\\h\\[\\e[0;0m\\] \\$ '"

# ============================================================
# CRI (containerd)
# ============================================================

- name: Установить containerd
  ansible.builtin.include_tasks: containerd.yaml

# ============================================================
# Kubernetes пакеты
# ============================================================

- name: Установка Kubernetes
  block:
      # ============================================================
      # Online mode — настройка репозиториев
      # ============================================================

      - name: Репозиторий Kubernetes [RedHat]
        when: k8s_install_mode == "online"
        ansible.builtin.yum_repository:
            name: kubernetes
            description: "Base programs for k8s, version: v{{ kube_version | regex_search('[0-9]+.[0-9]+') }}"
            baseurl: "https://pkgs.k8s.io/core:/stable:/v{{ kube_version | regex_search('[0-9]+.[0-9]+') }}/rpm/"
            gpgcheck: true
            enabled: true
            gpgkey:
                - "https://pkgs.k8s.io/core:/stable:/v{{ kube_version | regex_search('[0-9]+.[0-9]+') }}/rpm/repodata/repomd.xml.key"
            state: present

      # ============================================================
      # Online — установка пакетов из репозитория
      # ============================================================

      # Пред-установка из локального кэша (если RPM предзагружены в tmp/offline/packages)
      - name: Создать каталог для пакетов (для предзагруженных RPM)
        ansible.builtin.file:
            path: "{{ k8s_packages_remote_dir }}"
            state: directory
            mode: "0755"

      - name: Проверить наличие предзагруженных RPM
        ansible.builtin.find:
            paths: "{{ playbook_dir }}/{{ k8s_offline_dir }}/packages"
            patterns: "*.rpm"
        delegate_to: localhost
        become: false
        run_once: true
        register: _preloaded_k8s_rpm

      - name: Копировать предзагруженные RPM на ноды
        when: _preloaded_k8s_rpm.matched | int > 0
        ansible.builtin.copy:
            src: "{{ item.path }}"
            dest: "{{ k8s_packages_remote_dir }}/"
            mode: "0644"
        loop: "{{ _preloaded_k8s_rpm.files }}"

      - name: Установить Kubernetes из предзагруженных RPM
        when: _preloaded_k8s_rpm.matched | int > 0
        ansible.builtin.shell: >
            dnf install -y {{ k8s_packages_remote_dir }}/kubeadm*.rpm {{ k8s_packages_remote_dir }}/kubelet*.rpm {{ k8s_packages_remote_dir }}/kubectl*.rpm {{ k8s_packages_remote_dir }}/kubernetes-cni*.rpm {{ k8s_packages_remote_dir }}/cri-tools*.rpm
        args:
            creates: /usr/bin/kubeadm

      - name: Установить Kubernetes [online]
        when:
            - k8s_install_mode == "online"
            - _preloaded_k8s_rpm.matched | int == 0
        ansible.builtin.dnf:
            name: "{{ packages_k8s }}"
            state: present

      # ============================================================
      # Offline — установка из локальных пакетов
      # ============================================================

      - name: Создать каталог для пакетов [offline]
        when: k8s_install_mode == "offline"
        ansible.builtin.file:
            path: "{{ k8s_packages_remote_dir }}"
            state: directory
            mode: "0755"

      - name: Скопировать пакеты Kubernetes на ноды [offline]
        when: k8s_install_mode == "offline"
        ansible.builtin.copy:
            src: "{{ item }}"
            dest: "{{ k8s_packages_remote_dir }}/"
            mode: "0644"
        loop: "{{ query('fileglob', playbook_dir ~ '/' ~ k8s_offline_dir ~ '/packages/*.rpm') | list }}"

      - name: Найти offline-образы контейнеров [offline]
        when: k8s_install_mode == "offline"
        ansible.builtin.find:
            paths: "{{ playbook_dir }}/{{ k8s_offline_dir }}/images"
            patterns: "*.tar"
            recurse: true
        delegate_to: localhost
        become: false
        run_once: true
        register: _offline_images

      - name: Скопировать образы контейнеров на ноду [offline]
        when:
            - k8s_install_mode == "offline"
            - _offline_images.matched | int > 0
        ansible.builtin.copy:
            src: "{{ item.path }}"
            dest: "{{ k8s_packages_remote_dir }}/images/"
            mode: "0644"
        loop: "{{ _offline_images.files }}"

      - name: Установить Kubernetes из RPM [offline]
        when: k8s_install_mode == "offline"
        ansible.builtin.command: >
            dnf install -y {{ k8s_packages_remote_dir }}/kubeadm*.rpm {{ k8s_packages_remote_dir }}/kubelet*.rpm {{ k8s_packages_remote_dir }}/kubectl*.rpm
        args:
            creates: /usr/bin/kubeadm

# Точка расширения: post-prepare hooks
- name: Выполнить post-prepare hooks
  ansible.builtin.include_tasks: "{{ item }}"
  loop: "{{ post_prepare_tasks | default([]) }}"
  when: post_prepare_tasks | default([]) | length > 0
